# Reload config with prefix + r
unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Change prefix to Ctrl+Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# General options
set -g mouse on
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",ghostty*:RGB"
set -g set-clipboard on
set -g status-position top

# Start numbering at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# New windows and splits open in the current path
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Pane navigation with h/j/k/l
bind-key -r h select-pane -L
bind-key -r j select-pane -D
bind-key -r k select-pane -U
bind-key -r l select-pane -R

# Popup bindings
bind C-g display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "lazygit"
bind C-p display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "ipython"
bind C-r display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "ranger"
bind C-e display-popup -w 80% -h 80% -E "zsh -lc 'if command -v nvim >/dev/null 2>&1; then exec nvim ~/.zshrc; elif command -v vim >/dev/null 2>&1; then exec vim ~/.zshrc; else exec nano ~/.zshrc; fi'"
bind C-t display-popup -d "#{pane_current_path}" -w 75% -h 75% -E "$SHELL -lc 'exec zsh'"

# Session helpers
bind C-n command-prompt -p "Session name:" "new-session -Ad -s '%%' -c '#{pane_current_path}' \; switch-client -t '%%'"
bind C-j choose-tree -Zs

# Catppuccin configuration (must be before TPM)
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

# Session persistence
set -g @resurrect-capture-pane-contents "on"
set -g @continuum-restore "on"

# Plugins
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-sensible"
set -g @plugin "tmux-plugins/tmux-cpu"
set -g @plugin "tmux-plugins/tmux-battery"
set -g @plugin "tmux-plugins/tmux-yank"
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-continuum"
set -g @plugin "catppuccin/tmux#v2.1.3"

run "~/.tmux/plugins/tpm/tpm"

# Status line
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"
